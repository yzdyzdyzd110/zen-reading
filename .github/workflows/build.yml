name: Build Desktop App

on:
  push:
    branches: [master, main, feature/*]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install root dependencies
        run: npm install

      - name: Install PyQt6 and PyInstaller
        run: pip install PyQt6 pyinstaller

      - name: Package Launcher
        run: python launcher/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ZenReading-Windows
          path: release/ZenReading/

  build-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install root dependencies
        run: npm install

      - name: Install PyQt6 and PyInstaller
        run: pip install PyQt6 pyinstaller

      - name: Package Launcher
        run: python launcher/build.py

      - name: Ad-hoc sign (remove Gatekeeper warning)
        run: codesign --force --deep --sign - release/ZenReading/ZenReading.app

      - uses: actions/upload-artifact@v4
        with:
          name: ZenReading-Mac
          path: release/ZenReading/
