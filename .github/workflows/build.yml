name: Build Desktop App

on:
  push:
    branches: [master, main, feature/*]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Package Windows
        run: npx electron-builder --win portable --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: ZenReading-Windows
          path: release/ZenReading-*.exe

  build-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Package Mac (x64)
        run: npx electron-builder --mac --x64 --publish=never

      - name: Package Mac (arm64)
        run: npx electron-builder --mac --arm64 --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: ZenReading-Mac-x64
          path: release/ZenReading-*x64*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ZenReading-Mac-arm64
          path: release/ZenReading-*arm64*.dmg
